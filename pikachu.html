---
layout: null
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Pikachu Writeups</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: url("lazy.jpg") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
}

.bg-mask {
    background-color: rgba(0, 0, 0, 0.55);
    min-height: 100vh;
    padding: 30px 16px;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
}

.container {
    max-width: 700px;
    margin: 0 auto;
}

.back-link {
    display: inline-block;
    color: #87CEFA;
    text-decoration: none;
    margin-bottom: 24px;
}
.back-link:hover{
    text-decoration: underline;
}
h1{
    text-align:center;
}
.item{
    padding:10px 14px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:8px;
    margin:10px 0;
}
.item a{
    color:#98fb98;
    text-decoration:none;
}
.item a:hover{
    color:#fff;
    text-decoration:underline;
}
</style>
</head>
<body>
<div class="bg-mask">
    <div class="container">
        <a class="back-link" href="index.html">← 返回博客首页</a >
        <h1>Pikachu 靶场 Writeup 目录</h1>

        {% assign pikachu_posts = site.tags.Pikachu | reverse %}
        {% if pikachu_posts.size > 0 %}
            {% for post in pikachu_posts %}
            <div class="item">
                <a href="{{ post.url }}">{{ post.title }}</a >
            </div>
            {% endfor %}
        {% else %}
            <div class="item">
                <span style="color:#ccc;">暂无题解，快去刷题写Writeup吧✨</span>
            </div>
        {% endif %}

    </div>
</div>
</body>
</html>
