<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gysbfff 的技术博客</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #222;
  background: #ffffff;
}

/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 32px;
  background: rgba(0,0,0,0.35);
  color: #fff;
  position: absolute;
  width: 100%;
  top: 0;
  z-index: 10;
}

header .logo {
  font-size: 24px;
  font-weight: bold;
}

.hamburger {
  font-size: 32px;
  cursor: pointer;
}

.menu {
  position: absolute;
  top: 70px;
  right: 32px;
  background: rgba(0,0,0,0.75);
  border-radius: 8px;
  padding: 12px 0;
  display: none;
}

.menu a {
  display: block;
  color: white;
  text-decoration: none;
  padding: 10px 24px;
}

.menu a:hover {
  background: rgba(255,255,255,0.2);
}

.menu.show {
  display: block;
}

/* 横幅保持不变，中间加文字 */
.banner {
  width: 100%;
  height: 340px;
  background-image: url("banner.jpg");
  background-size: cover;
  background-position: center;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.banner-text {
  background: rgba(0,0,0,0.45);
  padding: 24px 32px;
  border-radius: 12px;
}

.banner-text h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

.banner-text p {
  font-size: 16px;
  opacity: 0.9;
}

/* 文章列表 */
.container {
  max-width: 960px;
  margin: 40px auto;
  padding: 0 24px;
}

.container h2 {
  margin-bottom: 24px;
  border-left: 5px solid #2277dd;
  padding-left: 14px;
  font-size: 28px;
}

.post-item {
  padding: 18px 0;
  border-bottom: 1px solid #eee;
}

.post-item a {
  font-size: 24px;
  color: #2277dd;
  text-decoration: none;
}

.post-item p {
  margin-top: 8px;
  color: #666;
  font-size: 18px;
}
</style>
</head>
<body>

<header>
  <div class="logo">gysbfff</div>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <div class="menu" id="navMenu">
    <a href=" ">首页</a >
  </div>
</header>

<div class="banner">
  <div class="banner-text">
    <h1>gysbfff的技术博客</h1>
    <p>关注：网络安全、学习记录、技术实践</p >
  </div>
</div>

<div class="container">
  <h2>📖 博客文章</h2>
  {% for post in site.posts %}
  <div class="post-item">
    <a href="{{ post.url }}">{{ post.title }}</a >
    <p>发布时间：{{ post.date | date: "%Y-%m-%d" }}</p >
  </div>
  {% endfor %}
</div>

<script>
function toggleMenu() {
  document.getElementById("navMenu").classList.toggle("show");
}

document.addEventListener('click', function(e) {
  const menu = document.getElementById("navMenu");
  const hamburger = document.querySelector(".hamburger");
  if (!hamburger.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove("show");
  }
});
</script>

</body>
</html>
