<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gysbfff 的技术博客</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #222;
  background: #ffffff;
}
/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 40px;
  background: rgba(0,0,0,0.45);
  color: white;
  position: absolute;
  width: 100%;
  top:0;
}
header .logo{
  font-size:22px;
  font-weight:bold;
}
header nav a{
  color:white;
  text-decoration:none;
  margin-left:24px;
}
/* 横幅banner */
.banner{
  width:100%;
  height:320px;
  background-image: url("banner.jpg");
  background-size: cover;
  background-position:center;
}
/* 文章区域 */
.container{
  max-width:960px;
  margin:40px auto;
  padding:0 20px;
}
.container h2{
  margin-bottom:20px;
  border-left:4px solid #2277dd;
  padding-left:12px;
}
.post-item{
  padding:16px;
  border-bottom:1px solid #eee;
}
.post-item a{
  font-size:19px;
  color:#2277dd;
  text-decoration:none;
}
.post-item p{
  margin-top:6px;
  color:#666;
}
</style>
</head>
<body>
<header>
  <div class="logo">gysbfff</div>
  <nav>
    <a href=" ">首页</a >
  </nav>
</header>
<div class="banner"></div>
<div class="container">
  <h2>📖 博客文章</h2>
  {% for post in site.posts %}
  <div class="post-item">
    <a href="{{ post.url }}">{{ post.title }}</a >
    <p>发布时间：{{ post.date | date:"%Y-%m-%d" }}</p >
  </div>
  {% endfor %}
</div>
</body>
</html>
