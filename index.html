---
layout: default
title: CTF刷题首页 | gysbfff 的技术博客
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style>
body {
  margin: 0;
  padding: 40px 20px;
  background-image: url("lazy.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;
  background-position: center;
  font-family: system-ui, sans-serif;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: -1;
  pointer-events: none;
}

.header-title {
  text-align: center;
  color: #fff;
  margin-bottom: 30px;
}

.header-title hr {
  width: 560px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  margin: 14px auto;
}

.header-title h1 {
  font-size: 3.4rem;
  margin: 10px 0;
  font-weight: bold;
}

.header-title .sub-desc {
  font-size: 1.15rem;
  opacity: 0.9;
  margin-top: 4px;
}

.cards-container {
  display: flex;
  flex-direction: column;
  gap: 24px;
  align-items: center;
}

.card {
  width: 560px;
  padding: 30px;
  border-radius: 18px;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #ffffff;
  cursor: pointer;
  transition: 0.25s ease;
}

.card:hover {
  transform: translateY(-4px);
  background: rgba(0, 0, 0, 0.6);
}

.card .tag-title {
  color: #a0c4ff;
  font-size: 1.15rem;
}

.card .main-title {
  font-size: 2.6rem;
  margin: 4px 0 10px 0;
}

.card .desc {
  font-size: 1rem;
  line-height: 1.55;
  opacity: 0.92;
}

.card .count {
  margin-top: 18px;
  font-size: 1.25rem;
}

@media (max-width: 700px) {
  .header-title hr {
    width: 90%;
  }

  .card {
    width: 90%;
  }

  .header-title h1 {
    font-size: 2.4rem;
  }
}
</style>
</head>
<body>
<div class="header-title">
  <hr>
  <h1>CTF Writeups</h1>
  <hr>
  <div class="sub-desc">按平台整理刷题记录 & 学习方法论</div>
</div>

<div class="cards-container">
  <!-- Bugku卡片 -->
  <div class="card" onclick="location.href='/bugku.html'">
    <div class="tag-title">BUGKU CTF</div>
    <div class="main-title">Bugku</div>
    <div class="desc">Web、Misc、Crypto、Reverse、PWN 入门题目</div>
    <div class="count">{{ site.tags.bugku.size }} 篇</div>
  </div>

  <!-- CTFHub卡片 -->
  <div class="card" onclick="location.href='/ctfhub.html'">
    <div class="tag-title">CTFHUB</div>
    <div class="main-title">CTFHub</div>
    <div class="desc">CTFHub 技能树与综合靶场题解</div>
    <div class="count">{{ site.tags.ctfhub.size }} 篇</div>
  </div>

  <!-- 微方法论卡片，跳转 weifangfalun.html -->
  <div class="card" onclick="location.href='/weifangfalun.html'">
    <div class="tag-title">学习框架</div>
    <div class="main-title">微方法论</div>
    <div class="desc">信息安全学习思路、解题思考框架、复盘方法论</div>
    <div class="count">{{ site.tags.micro-method.size }} 篇</div>
  </div>

</div>
</body>
</html>
