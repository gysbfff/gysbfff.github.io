<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Bugku Writeups</title>
</head>
<body>
    <div style="text-align:center;margin:30px 0;">
        <h1>Bugku 题解</h1>
        <a href=" ">← 返回博客首页</a >
    </div>

    <h2>文章列表</h2>
    <ul>
        {% assign posts = site.posts | where_exp:"p","p.categories[0] == 'Bugku'" %}
        {% for post in posts %}
            <li><a href="{{ post.url }}">{{ post.title }}</a ></li>
        {% endfor %}
    </ul>
</body>
</html>
