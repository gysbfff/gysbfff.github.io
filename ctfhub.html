---
layout: null
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CTFHub Writeups</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: url("lazy.jpg") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
}
.bg-mask {
    background-color: rgba(255,255,255,0.72);
    min-height: 100vh;
    padding:30px 10px;
}
</style>
</head>
<body>
<div class="bg-mask">
    <div style="text-align:center;margin:30px 0;">
        <h1>CTFHub 题解</h1>
        <a href=" ">← 返回博客首页</a >
    </div>

    <h2>文章列表</h2>
    <ul>
        {% assign posts = site.posts | where_exp:"p","p.categories[0] == 'CTFHub'" %}
        {% if posts.size > 0 %}
            {% for post in posts %}
                <li><a href="{{ post.url }}">{{ post.title }}</a ></li>
        {% else %}
            <li>暂时没有CTFHub分类的文章，请检查文章categories！</li>
        {% endif %}
    </ul>
</div>
</body>
</html>
